name: Render

# One full generation run for a story: voices, images, videos. Started by the app.
run-name: render ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Story id
        required: true
      formats:
        description: Video formats, comma separated
        required: false
        default: 16x9,9x16
      mode:
        description: "full (videos and snippets) or snippets (teasers only)"
        required: false
        default: full

# A newer run for the same story replaces an older one.
concurrency:
  group: render-${{ inputs.job_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Not `npm ci`: a lock file written on Windows misses some Linux-only optional
      # packages (npm bug), which makes `npm ci` refuse. `--no-save` keeps the lock file as is.
      - name: Install
        run: npm install --no-audit --no-fund --no-save

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install backup voices (Piper)
        continue-on-error: true
        run: pip install -r worker/requirements.txt

      - name: Cache backup voice models
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper-voices
          key: piper-voices-v1

      - name: Generate
        env:
          JOB_ID: ${{ inputs.job_id }}
          FORMATS: ${{ inputs.formats }}
          MODE: ${{ inputs.mode }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
        run: node worker/cloud.ts "$JOB_ID" --formats "$FORMATS" --mode "${MODE:-full}"
